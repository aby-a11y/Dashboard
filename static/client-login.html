<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Login — SEO Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #262a33;
    --text: #e6e8eb; --muted: #9099a6; --accent: #4f8cff; --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text);
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 28px; width: 100%; max-width: 340px;
  }
  h1 { font-size: 18px; margin: 0 0 20px; text-align: center; }
  label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  input {
    width: 100%; margin: 6px 0 16px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #0f1115; color: var(--text); font-size: 14px;
  }
  button {
    width: 100%; background: var(--accent); border: none; color: white; padding: 11px;
    border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--error); font-size: 13px; margin-top: 12px; text-align: center; display: none; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>📊 Client Login</h1>
    <label for="clientId">Client ID</label>
    <input type="text" id="clientId" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Log In</button>
    <div class="error" id="errorMsg"></div>
  </form>

<script>
const API = "";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errorEl = document.getElementById("errorMsg");
  errorEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Logging in...";

  try {
    const res = await fetch(`${API}/api/client/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        client_id: document.getElementById("clientId").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Login failed");

    localStorage.setItem("client_token", data.token);
    localStorage.setItem("client_site_url", data.site_url);
    localStorage.setItem("client_name", data.name || "");
    localStorage.setItem("client_ga4_property_id", data.ga4_property_id || "");
    window.location.href = "/static/Clientview.html";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Log In";
  }
});
</script>
</body>
</html>
